name: build-md2doc-exe

# 自动在 Windows 环境用 PyInstaller 把改进版 md2doc.py 打包成 md2doc.exe
# - 推送到 main 分支：构建并上传为 Actions 工件（Artifacts）
# - 打 tag（如 v2.0.0）：构建并发布到 Releases 下载页
#
# 触发方式：
#   git tag v2.0.0 && git push origin v2.0.0

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 PyInstaller
        run: pip install pyinstaller

      - name: 打包 md2doc.exe
        working-directory: markdown授课（Windows7）/tools/md2doc
        run: pyinstaller --onefile --windowed --clean --name md2doc md2doc.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: md2doc-windows-exe
          path: markdown授课（Windows7）/tools/md2doc/dist/md2doc.exe

      - name: 发布到 Releases（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: markdown授课（Windows7）/tools/md2doc/dist/md2doc.exe
          generate_release_notes: true
